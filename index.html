<body>

<header class="hdr">
  <div class="hdr-in">
    <a class="brand" href="#" data-go="deals" aria-label="HK Cheap Eats home">
      <span class="brand-seal">慳</span>
      <span class="brand-txt"><b>HK Cheap Eats</b><small>港 慳 食</small></span>
    </a>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

      <button class="btn btn-ink" id="share-btn"></button>
    </div>
  </div>
</header>

<section class="view" id="v-deals">
  <div class="wrap">
    <div class="hero">
      <div>
        <div class="kicker" id="kicker"></div>
        <h1 class="hero-h" id="hero-h"></h1>
        <p class="hero-p" id="hero-p"></p>
        <label class="hero-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="hq" type="search" autocomplete="off" enterkeyhint="search" aria-label="Search">
        </label>
        <div class="hero-cta">
          <button class="btn btn-red btn-lg" id="spin-btn"></button>
          <button class="btn btn-ghost btn-lg" id="near-btn"></button>
        </div>
        <div class="quick" id="quick"></div>
      </div>
      <div id="spotlight"></div>
    </div>
  </div>
  <div class="ticker" id="ticker" aria-hidden="true"></div>
  <div class="wrap">
    <div class="sec-h" id="cols-h"></div>
    <div class="cats" id="cols"></div>
    <div id="rails"></div>
    <div class="promo" id="promo" role="button" tabindex="0"></div>

    <div class="toolbar" id="toolbar">
      <div class="rail" id="rail"></div>
      <div class="tool-r">
        <button class="btn btn-ghost" id="filter-btn"></button>
        <select class="select" id="sort" aria-label="Sort"></select>
      </div>
    </div>
    <div class="active-row" id="active-row"></div>
    <div class="grid" id="grid"></div>
    <footer class="foot" id="foot"></footer>
  </div>
</section>

<section class="view" id="v-map">
  <div class="wrap">
    <div class="mapwrap">
      <div class="maprail">
        <div class="mr-h"><h2 id="map-t"></h2><p id="map-s"></p><div class="map-tools" id="map-tools"></div></div>
        <div id="maplist"></div>
      </div>
      <div id="map"></div>
    </div>
  </div>
</section>

<section class="view" id="v-saved"><div class="wrap" id="saved-in"></div></section>
<section class="view" id="v-guide"><div class="wrap" id="guide-in"></div></section>
